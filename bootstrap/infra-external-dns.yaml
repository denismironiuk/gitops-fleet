apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.15.0
    helm:
      values: |
        provider: azure
        sources:
          - gateway-httproute
        
        # Настройка прав и Workload Identity
        serviceAccount:
          name: external-dns-sa
          annotations:
            azure.workload.identity/client-id: "dbafb21d-f2e1-495c-bc64-9991cb12ebd1"
        podLabels:
          azure.workload.identity/use: "true"
        
        rbac:
          create: true
          additionalPermissions:
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["httproutes", "gateways", "gatewayclasses"]
              verbs: ["get", "watch", "list"]

        # ПРИНУДИТЕЛЬНОЕ МОНТИРОВАНИЕ ФАЙЛА
        extraVolumes:
          - name: azure-config
            secret:
              secretName: external-dns-azure-config
        extraVolumeMounts:
          - name: azure-config
            mountPath: /etc/kubernetes
            readOnly: true

        extraArgs:
          - --txt-owner-id=aks-prod-cluster
          - --domain-filter=jenkinsdevops.org
          - --log-level=info
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]