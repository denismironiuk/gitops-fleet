apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15" # Ставим после контроллера
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.15.0
    helm:
      values: |
        provider: azure
        # Добавляем лейбл для инъекции токена Azure (как в cert-manager)
        podLabels:
          azure.workload.identity/use: "true"
        serviceAccount:
          annotations:
            azure.workload.identity/client-id: "f4fc578b-e718-46b7-9022-2240d12a2c91"
        # ПРАВИЛЬНЫЙ СПОСОБ: используем встроенный массив sources
        sources:
          - service
          - ingress
          - gateway-httproute
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true