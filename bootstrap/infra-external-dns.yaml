apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.15.0
    helm:
      values: |
        provider: azure
        # Указываем источники явно, чтобы убрать лишние service/ingress
        sources:
          - gateway-httproute
        
        azure:
          useWorkloadIdentityExtension: true
          # Эти поля важны, чтобы он не искал конфиг-файл
          resourceGroup: rg-migration-prod
          subscriptionId: fcf3f628-5f65-43c3-8a08-8b202b22def0
          tenantId: 69982d6a-e385-4e42-bdcd-4159c0dcb907

        rbac:
          create: true
          additionalPermissions:
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["httproutes", "gateways"]
              verbs: ["get", "watch", "list"]

        serviceAccount:
          name: external-dns-sa
          annotations:
            azure.workload.identity/client-id: "dbafb21d-f2e1-495c-bc64-9991cb12ebd1"
        
        podLabels:
          azure.workload.identity/use: "true"

        extraArgs:
          - --txt-owner-id=aks-prod-cluster
          - --domain-filter=jenkinsdevops.org
          - --azure-skip-msi
          # ПРИНУДИТЕЛЬНО ПЕРЕВОДИМ НА v1
          - --gateway-api-version=v1 
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]