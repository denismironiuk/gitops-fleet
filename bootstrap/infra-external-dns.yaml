apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.15.0
    helm:
      values: |
        provider: azure
        podLabels:
          azure.workload.identity/use: "true"
        serviceAccount:
          annotations:
            azure.workload.identity/client-id: "f4fc578b-e718-46b7-9022-2240d12a2c91"
        sources:
          - service
          - ingress
          - gateway-httproute
        # --- ПЕРЕДАЕМ НАСТРОЙКИ ЧЕРЕЗ ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ---
        env:
          - name: AZURE_TENANT_ID
            value: "69982d6a-e385-4e42-bdcd-4159c0dcb907"
          - name: AZURE_SUBSCRIPTION_ID
            value: "fcf3f628-5f65-43c3-8a08-8b202b22def0"
          - name: AZURE_RESOURCE_GROUP
            value: "rg-migration-prod"
        # ------------------------------------------------------
        extraArgs:
          - "--azure-config-file=" # Отключаем поиск файла azure.json
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true