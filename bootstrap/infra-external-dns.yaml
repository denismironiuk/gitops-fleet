apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.15.0
    helm:
      values: |
        provider: azure
        podLabels:
          azure.workload.identity/use: "true"
        serviceAccount:
          annotations:
            azure.workload.identity/client-id: "f4fc578b-e718-46b7-9022-2240d12a2c91"
        sources:
          - service
          - ingress
          - gateway-httproute
        # --- ЖЕЛЕЗНОЕ РЕШЕНИЕ: МОНТИРУЕМ ФАЙЛ ИЗ CONFIGMAP ---
        extraVolumes:
          - name: azure-config
            configMap:
              name: external-dns-azure-config
        extraVolumeMounts:
          - name: azure-config
            mountPath: /etc/kubernetes/azure.json
            subPath: azure.json
            readOnly: true
        # -----------------------------------------------------
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true