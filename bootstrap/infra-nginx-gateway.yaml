apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-nginx-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: https://nginx.github.io/helm-charts
    chart: nginx-gateway-fabric
    targetRevision: 0.5.0
    helm:
      releaseName: ngf
      values: |
        # Control Plane Configuration
        replicaCount: 2
        podAnnotations: {}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true