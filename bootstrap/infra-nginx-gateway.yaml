apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-18"
spec:
  project: default
  source:
    repoURL: 'https://github.com/nginxinc/nginx-gateway-fabric.git'
    targetRevision: v2.4.2
    path: charts/nginx-gateway-fabric
    helm:
      releaseName: ngf
      values: |
        service:
          type: LoadBalancer
        podLabels:
          azure.workload.identity/use: "true"
        serviceAccount:
          # Явно задаем имя, чтобы Azure знал, кому доверять
          name: nginx-gateway-sa 
          annotations:
            # Рекомендую использовать тот же ID, что и для cert-manager (dbafb21d...)
            # Либо f4fc578b... если у него есть права на Network Contributor
            azure.workload.identity/client-id: "dbafb21d-f2e1-495c-bc64-9991cb12ebd1"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true