apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: 'https://github.com/nginxinc/nginx-gateway-fabric.git'
    targetRevision: v2.4.2 # Та самая версия, которую ты нашел
    path: charts/nginx-gateway-fabric
    helm:
      releaseName: ngf
      values: |
        service:
          type: LoadBalancer
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true