apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    # Для OCI репозиториев в ArgoCD URL пишется так:
    repoURL: ghcr.io/nginx/charts
    chart: nginx-gateway-fabric
    # СТАВИМ СТАБИЛЬНУЮ ВЕРСИЮ NGF (на текущий момент это 1.5.0 или 1.6.0)
    targetRevision: 1.5.0 
    helm:
      # Имя релиза, как в твоей команде (ngf)
      releaseName: ngf
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true