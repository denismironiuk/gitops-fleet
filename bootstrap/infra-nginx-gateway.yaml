apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-18"
spec:
  project: default
  source:
    repoURL: 'https://github.com/nginxinc/nginx-gateway-fabric.git'
    targetRevision: v2.4.2
    path: charts/nginx-gateway-fabric
    helm:
      releaseName: ngf
      values: |
        # Правильное расположение настройки сервиса
        service:
          type: LoadBalancer
        # Обязательный лейбл для работы Workload Identity
        podLabels:
          azure.workload.identity/use: "true"
        serviceAccount:
          annotations:
            azure.workload.identity/client-id: "f4fc578b-e718-46b7-9022-2240d12a2c91"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Добавляем ServerSideApply для тяжелых манифестов NGF
      - ServerSideApply=true