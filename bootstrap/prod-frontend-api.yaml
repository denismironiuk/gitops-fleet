apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-frontend-api
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "10"}
spec:
  project: infrastructure
  source:
    repoURL: 'https://github.com/denismironiuk/gitops-fleet.git'
    targetRevision: main
    path: apps/overlays/prod/frontend-api
  destination:
    server: https://kubernetes.default.svc
    namespace: store-frontend
  # --- ДОБАВЬ ЭТОТ БЛОК ---
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: frontend  # Убедись, что имя совпадает с именем твоего Deployment
      jsonPointers:
        - /spec/replicas
  # ------------------------
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true