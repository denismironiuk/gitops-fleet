apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-15" # Волна после контроллеров
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: denis.mironik@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - dns01:
        azureDNS:
          subscriptionID: fcf3f628-5f65-43c3-8a08-8b202b22def0
          resourceGroupName: rg-migration-prod
          hostedZoneName: jenkinsdevops.org
          environment: AzurePublicCloud
          # Используем Workload Identity (как и в контроллере)
          managedIdentity:
            clientID: f4fc578b-e718-46b7-9022-2240d12a2c91