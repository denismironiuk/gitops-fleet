apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30" # Самый первый уровень
spec:
  project: default
  source:
    repoURL: 'https://github.com/kubernetes-sigs/gateway-api.git'
    targetRevision: v1.5.0
    path: config/crd/standard
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default # CRD всегда глобальны
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # Маст-хэв для тяжелых манифестов Gateway API