apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-gateway-api-crds
  namespace: argocd
  annotations:
    # Самая ранняя волна: CRD должны стоять первыми в кластере
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: default
  source:
    repoURL: 'https://github.com/denismironiuk/gitops-fleet.git' # Твой репо
    targetRevision: main
    path: infrastructure/base/gateway-api/crds # Путь к скачанному файлу
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default # Для CRD неймспейс не важен, они Cluster-scoped
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # КЛЮЧЕВОЙ МОМЕНТ: аналог --server-side
      - ServerSideApply=true