apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  # ДОБАВЛЯЕМ: Теперь при удалении этого файла, снесется всё остальное само
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/denismironiuk/gitops-fleet.git'
    targetRevision: main
    path: bootstrap
    # ВОТ ОНО: Явное указание использовать Kustomize
    kustomize:
      version: v4 # Или v5, если хочешь посвежее
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # Лишним не будет
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m