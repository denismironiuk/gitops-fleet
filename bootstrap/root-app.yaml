apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/denismironiuk/gitops-fleet.git'
    targetRevision: main
    path: bootstrap # Смотрит в ту же папку, где лежит сам
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5 # Senior touch: если гит лагает, он попробует еще раз
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m