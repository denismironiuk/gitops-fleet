apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.14.4
    helm:
      values: |
        installCRDs: true
        podLabels:
          azure.workload.identity/use: "true"
        serviceAccount:
          # Важно: имя должно быть infra-cert-manager, как мы настраивали в FIC
          name: infra-cert-manager
          annotations:
            # Твой НОВЫЙ ID, который мы создали минуту назад
            azure.workload.identity/client-id: "dbafb21d-f2e1-495c-bc64-9991cb12ebd1"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cert-manager
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: infra-cert-manager-webhook
      jqPathExpressions:
        - '.webhooks[].namespaceSelector'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: infra-cert-manager-webhook
      jqPathExpressions:
        - '.webhooks[].namespaceSelector'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true