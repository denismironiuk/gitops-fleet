apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-cert-manager
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.14.4
    helm:
      values: |
        installCRDs: true
  destination: {server: 'https://kubernetes.default.svc', namespace: cert-manager}
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: infra-cert-manager-webhook
      jqPathExpressions: ['.webhooks[].namespaceSelector.matchExpressions']
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: infra-cert-manager-webhook
      jqPathExpressions: ['.webhooks[].namespaceSelector.matchExpressions']
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]