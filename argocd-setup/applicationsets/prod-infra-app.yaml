apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-infrastructure
  namespace: argocd
spec:
  project: infrastructure
  source:
    repoURL: 'https://github.com/denismironiuk/gitops-fleet.git' # Не забудь свой URL
    targetRevision: main
    path: infrastructure/overlays/prod-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: default # <-- Добавили обязательное поле
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true